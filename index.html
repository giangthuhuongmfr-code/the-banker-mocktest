nhanh, rủi ro nào nổi bật?", "a": "Rủi ro lãi suất do chênh lệch kỳ hạn và khả năng tái định giá giữa tài sản và nguồn vốn.", "ex": "Chi phí huy động có thể tăng trước trong khi thu nhập từ khoản vay cố định chưa tăng.", "trap": "Không chỉ là rủi ro tín dụng."}, {"id": "H017", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Ngân hàng", "priority": "S - bắt buộc", "level": 3, "q": "Dư nợ cho vay tăng nhanh hơn tiền gửi trong nhiều kỳ liên tiếp. Chỉ số nào nên được theo dõi trực tiếp để nhìn áp lực này?", "a": "Tỷ lệ dư nợ cho vay trên tiền gửi.", "ex": "Chỉ số phản ánh mức độ sử dụng nguồn tiền gửi để tài trợ cho hoạt động cho vay.", "trap": "Không thể kết luận rủi ro thanh khoản chỉ từ một tỷ lệ, nhưng đây là chỉ báo trực tiếp."}, {"id": "H018", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Ngân hàng", "priority": "S - bắt buộc", "level": 3, "q": "Ngân hàng có lợi nhuận tăng nhưng tài sản sinh lãi tăng còn nhanh hơn, trong khi thu nhập lãi thuần gần như không đổi. Chỉ tiêu nào có khả năng giảm?", "a": "Biên lãi ròng.", "ex": "Biên lãi ròng phụ thuộc thu nhập lãi thuần trên tài sản sinh lãi bình quân.", "trap": "Lợi nhuận tăng không đồng nghĩa NIM tăng."}, {"id": "H019", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Doanh nghiệp", "priority": "S - bắt buộc", "level": 3, "q": "Doanh nghiệp bán hàng nhiều hơn nhưng thời gian thu tiền khách hàng tăng mạnh, trong khi tồn kho và thời gian trả nhà cung cấp không đổi. Chu kỳ chuyển đổi tiền mặt sẽ biến động thế nào?", "a": "Tăng.", "ex": "Số ngày thu tiền bình quân tăng làm tiền bị khóa lâu hơn trong khoản phải thu.", "trap": "Không cần doanh thu giảm thì vốn lưu động vẫn có thể xấu đi."}, {"id": "H020", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Tài trợ thương mại", "priority": "S - bắt buộc", "level": 3, "q": "Người mua đã xác nhận hóa đơn; bên tài trợ dựa trên tín nhiệm của người mua để trả sớm cho nhà cung cấp. Cấu trúc này gần nhất với hình thức nào?", "a": "Bao thanh toán ngược hoặc tài trợ nhà cung cấp.", "ex": "Nguồn tín nhiệm trọng tâm nằm ở người mua đã xác nhận nghĩa vụ phải trả.", "trap": "Khác với bao thanh toán truyền thống dựa chủ yếu trên khoản phải thu của người bán."}, {"id": "H021", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Ngoại hối", "priority": "S - bắt buộc", "level": 3, "q": "Doanh nghiệp chắc chắn sẽ thu USD sau 60 ngày và lo USD giảm giá so với VND. Công cụ đơn giản nhất để khóa trước tỷ giá bán USD là gì?", "a": "Hợp đồng ngoại hối kỳ hạn.", "ex": "Doanh nghiệp có thể thỏa thuận trước tỷ giá cho ngày tương lai để giảm bất định dòng tiền.", "trap": "Không phải công cụ tối ưu cho mọi trường hợp nhưng phù hợp mục tiêu khóa tỷ giá."}, {"id": "H022", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Open Banking", "priority": "S - bắt buộc", "level": 3, "q": "Nếu một quốc gia buộc các ngân hàng lớn phải cung cấp API theo chuẩn chung để thúc đẩy cạnh tranh, mô hình triển khai này thiên về hướng nào?", "a": "Hướng do cơ quan quản lý dẫn dắt.", "ex": "Quy định bắt buộc và tiêu chuẩn chung là dấu hiệu của mô hình regulation-led.", "trap": "Khác với market-led, nơi thị trường tự thỏa thuận tiêu chuẩn."}, {"id": "H023", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Open Banking", "priority": "S - bắt buộc", "level": 3, "q": "Một thị trường để từng ngân hàng tự thiết kế API mà không có chuẩn chung. Rủi ro tích hợp nổi bật nhất đối với Fintech là gì?", "a": "Phân mảnh tiêu chuẩn và chi phí tích hợp cao.", "ex": "Đối tác phải xây và duy trì nhiều kết nối khác nhau cho cùng một loại dịch vụ.", "trap": "Nhiều API không đồng nghĩa có khả năng tương tác."}, {"id": "H024", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Open Banking", "priority": "S - bắt buộc", "level": 3, "q": "Một nền tảng kết nối song phương riêng với 30 ngân hàng. Khi thêm ngân hàng thứ 31, số kết nối tiếp tục tăng. Giá trị chính của một chuẩn API dùng chung là gì?", "a": "Giảm nhu cầu xây kết nối riêng cho từng cặp và tăng khả năng tương tác.", "ex": "Chuẩn chung giúp giảm chi phí tích hợp cận biên và thúc đẩy mở rộng hệ sinh thái.", "trap": "Không loại bỏ hoàn toàn mọi khác biệt nghiệp vụ."}, {"id": "H025", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Chiến lược", "priority": "S - bắt buộc", "level": 3, "q": "Một ứng dụng tài chính cá nhân kiếm tiền bằng cách bán dữ liệu giao dịch của người dùng cho quảng cáo, trong khi consent chỉ nêu mục đích quản lý chi tiêu. Rủi ro cốt lõi là gì?", "a": "Sử dụng dữ liệu vượt mục đích đã được người dùng đồng ý.", "ex": "Vấn đề nằm ở giới hạn mục đích sử dụng và quản trị dữ liệu chứ không phải chỉ ở bảo mật kỹ thuật.", "trap": "Dữ liệu lấy hợp lệ vẫn có thể bị sử dụng sai mục đích."}, {"id": "H026", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Dữ liệu", "priority": "S - bắt buộc", "level": 3, "q": "Một mô hình tín dụng dùng dữ liệu vị trí và danh bạ chỉ vì 'có sẵn', dù không chứng minh được giá trị dự báo. Nguyên tắc quản trị dữ liệu nào nên được đặt câu hỏi đầu tiên?", "a": "Chỉ thu thập và sử dụng dữ liệu cần thiết, phù hợp mục đích.", "ex": "Dữ liệu nhiều hơn không mặc định tạo mô hình tốt hơn; còn tăng rủi ro riêng tư và thiên lệch.", "trap": "Đừng đồng nhất big data với good data."}, {"id": "H027", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "API", "priority": "S - bắt buộc", "level": 3, "q": "Một API bị gọi hàng chục nghìn lần mỗi giây bởi cùng một đối tác và làm nghẽn hệ thống. Kiểm soát trực tiếp nhất là gì?", "a": "Giới hạn tần suất truy cập.", "ex": "giới hạn tần suất truy cập kiểm soát số lượng yêu cầu trong một khoảng thời gian để giảm lạm dụng và quá tải.", "trap": "Không thay thế hoàn toàn các biện pháp chống tấn công khác."}, {"id": "H028", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "API", "priority": "S - bắt buộc", "level": 3, "q": "Một thành phần phụ thuộc lỗi liên tục nhưng dịch vụ chính vẫn cố gọi lại không ngừng, khiến tài nguyên bị cạn kiệt. Mẫu thiết kế nào giúp ngắt tạm các lời gọi lỗi lặp lại?", "a": "Cơ chế ngắt mạch.", "ex": "Khi lỗi vượt ngưỡng, hệ thống tạm dừng gọi thành phần phụ thuộc và thử lại sau.", "trap": "Khác với thử lại đơn thuần, vốn có thể làm lỗi lan rộng nếu dùng sai."}, {"id": "H029", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Bảo mật", "priority": "S - bắt buộc", "level": 3, "q": "Một token bị ghi nguyên văn vào log và log lại được nhiều nhân viên truy cập. Rủi ro trực tiếp nhất là gì?", "a": "Lộ thông tin xác thực qua hệ thống nhật ký.", "ex": "Token có thể bị tái sử dụng nếu còn hiệu lực; log cần che/mask dữ liệu nhạy cảm.", "trap": "Log không phải vùng an toàn mặc định."}, {"id": "H030", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Bảo mật", "priority": "S - bắt buộc", "level": 3, "q": "Một API chỉ kiểm tra quyền ở giao diện người dùng; người dùng gọi trực tiếp điểm cuối API quản trị thì vẫn thành công. Lớp kiểm soát nào đang thiếu?", "a": "Kiểm tra phân quyền ở phía máy chủ cho từng chức năng.", "ex": "Ẩn nút trên giao diện không phải biện pháp bảo mật.", "trap": "Đừng dựa vào giao diện phía người dùng để bảo vệ chức năng nhạy cảm."}, {"id": "H031", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Fintech", "priority": "S - bắt buộc", "level": 3, "q": "Một startup chỉ đóng vai trò kết nối người vay và người cho vay, không dùng bảng cân đối của mình để cấp khoản vay. Mô hình này gần nhất với gì?", "a": "Cho vay ngang hàng.", "ex": "Nền tảng kết nối hai phía thay vì trực tiếp dùng vốn của chính mình như ngân hàng.", "trap": "Trong thực tế khung pháp lý có thể giới hạn rất chặt hoạt động này."}, {"id": "H032", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Fintech", "priority": "S - bắt buộc", "level": 3, "q": "Một dịch vụ cho phép khách mua hàng trên sàn thương mại điện tử và vay ngay tại bước thanh toán mà không rời nền tảng. Đây là biểu hiện điển hình của xu hướng nào?", "a": "Tài chính nhúng.", "ex": "Dịch vụ tài chính được đưa trực tiếp vào hành trình của nền tảng phi ngân hàng.", "trap": "Không đồng nghĩa nền tảng đó trở thành ngân hàng."}, {"id": "H033", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Open Finance", "priority": "S - bắt buộc", "level": 3, "q": "Open Banking chủ yếu mở dữ liệu tài khoản thanh toán; khi mở sang đầu tư, bảo hiểm và hưu trí thì khái niệm nào phù hợp hơn?", "a": "Open Finance.", "ex": "Open Finance mở rộng phạm vi dữ liệu và dịch vụ tài chính vượt khỏi ngân hàng thanh toán.", "trap": "Không phải mọi Open Finance đều có cùng phạm vi pháp lý ở mọi nước."}, {"id": "H034", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Chiến lược", "priority": "S - bắt buộc", "level": 3, "q": "Một ngân hàng tung API nhưng tài liệu tích hợp kém, môi trường thử nghiệm lỗi và đối tác mất sáu tháng mới kết nối. Nút thắt chính nằm ở đâu?", "a": "Trải nghiệm dành cho nhà phát triển và khả năng tích hợp.", "ex": "API kỹ thuật tốt nhưng trải nghiệm dành cho nhà phát triển kém vẫn làm chậm mở rộng hệ sinh thái.", "trap": "Không chỉ đánh giá API bằng uptime."}, {"id": "H035", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Chiến lược", "priority": "S - bắt buộc", "level": 3, "q": "Một ngân hàng có 20 triệu lượt gọi API nhưng hầu như không tạo ra khách hàng, doanh thu hay giao dịch mới. Có thể coi đây là thành công kinh doanh không?", "a": "Không.", "ex": "Lượt gọi API là chỉ số hoạt động, không tự chứng minh giá trị kinh doanh.", "trap": "Đừng dùng chỉ số bề nổi thay cho kết quả thực."}, {"id": "H036", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Dữ liệu", "priority": "S - bắt buộc", "level": 3, "q": "Một hệ thống có đầy đủ trường dữ liệu nhưng 15% giao dịch bị gán sai người trả tiền. Thuộc tính chất lượng nào bị ảnh hưởng trực tiếp nhất?", "a": "Tính chính xác.", "ex": "Dữ liệu đầy đủ nhưng sai nội dung vẫn không đáng tin cho đối soát hay chấm điểm.", "trap": "Đầy đủ và chính xác là hai thuộc tính khác nhau."}, {"id": "H037", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Doanh nghiệp", "priority": "S - bắt buộc", "level": 3, "q": "Một khoản phải thu đã được tài trợ gần 100% từ trước. Nếu một nền tảng mới chỉ giúp doanh nghiệp tiếp cận thêm đúng khoản đó, có thể coi toàn bộ giá trị giải ngân là vốn tăng thêm không?", "a": "Không.", "ex": "Chỉ phần tài trợ phát sinh thêm nhờ giải pháp mới mới là giá trị tăng thêm.", "trap": "Phân biệt tổng luồng vốn với giá trị tăng thêm."}, {"id": "H038", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Chiến lược", "priority": "S - bắt buộc", "level": 3, "q": "Một ngân hàng đặt phí API rất cao để tối đa doanh thu trên mỗi đối tác, nhưng số đối tác kết nối giảm mạnh. Bài toán nào phải cân nhắc?", "a": "Đánh đổi giữa mức phí và quy mô sử dụng/hệ sinh thái.", "ex": "Giá cao có thể tăng doanh thu đơn vị nhưng làm giảm mức độ sử dụng và hiệu ứng mạng lưới.", "trap": "Không tối ưu một biến riêng lẻ."}, {"id": "H039", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Rủi ro", "priority": "S - bắt buộc", "level": 3, "q": "Một sự cố tại nhà cung cấp đám mây khiến hàng loạt ngân hàng và Fintech dùng chung hạ tầng cùng gián đoạn. Đây chỉ là rủi ro riêng của một doanh nghiệp hay có thể thành rủi ro gì rộng hơn?", "a": "Có thể trở thành rủi ro hệ thống do phụ thuộc tập trung và lan truyền gián đoạn.", "ex": "Sự phụ thuộc chung vào một nhà cung cấp lớn làm tăng concentration risk và contagion.", "trap": "Không phải cứ sự cố công nghệ là systemic risk; phải có mức độ lan rộng đủ lớn."}, {"id": "H040", "part": "A - Chặng 1 phản xạ", "type": "Trả lời nhanh", "topic": "Open Banking", "priority": "S - bắt buộc", "level": 3, "q": "Một khách hàng đồng ý cho chia sẻ 'mọi dữ liệu, cho mọi mục đích, không giới hạn thời gian'. Điểm yếu thiết kế lớn nhất là gì?", "a": "Phạm vi, mục đích và thời hạn consent quá rộng, làm giảm tính minh bạch và quyền kiểm soát của khách hàng.", "ex": "Consent tốt phải cụ thể đủ để người dùng hiểu mình đang cho phép điều gì.", "trap": "Có consent không đồng nghĩa consent đó được thiết kế tốt."}, {"id": "H041", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Open Banking", "priority": "S - bắt buộc", "level": 4, "q": "Một ứng dụng quản lý tài chính cá nhân được người dùng cho phép đọc số dư và lịch sử giao dịch trong sáu tháng. Sau ba tháng, người dùng rút lại sự đồng ý. Ứng dụng không gọi API thêm nhưng vẫn dùng dữ liệu cũ để xây hồ sơ quảng cáo hành vi. Vấn đề chính lúc này nằm ở lớp kỹ thuật truy cập API hay ở quản trị sử dụng dữ liệu?", "a": "Chủ yếu nằm ở quản trị sử dụng dữ liệu và giới hạn mục đích.", "ex": "Việc ngừng gọi API cho thấy quyền truy cập có thể đã được chặn đúng. Tuy nhiên dữ liệu đã thu thập vẫn phải được sử dụng đúng mục đích và cơ sở xử lý phù hợp.", "trap": "Dễ nhầm giữa quyền truy cập dữ liệu mới và quyền tiếp tục dùng dữ liệu đã lưu."}, {"id": "H042", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Open Banking", "priority": "S - bắt buộc", "level": 4, "q": "Một ngân hàng yêu cầu khách hàng xác thực lại mỗi lần ứng dụng bên thứ ba đọc số dư, dù consent còn hiệu lực và không có thay đổi rủi ro. Tác động bất lợi dễ thấy nhất với hệ sinh thái là gì?", "a": "Tăng ma sát trải nghiệm, giảm tỷ lệ hoàn tất và làm suy yếu lợi ích của Open Banking.", "ex": "Bảo mật cần cân bằng với trải nghiệm. Xác thực quá mức có thể khiến người dùng bỏ luồng dù quyền đã được cấp hợp lệ.", "trap": "Không phải mọi bước xác thực bổ sung đều làm hệ thống an toàn hơn theo nghĩa tổng thể."}, {"id": "H043", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "API", "priority": "S - bắt buộc", "level": 4, "q": "Một nền tảng nhận Webhook báo tiền về nhưng do mạng lỗi nên ngân hàng gửi lại cùng một sự kiện bốn lần. Hệ thống của nền tảng ghi nhận bốn khoản thanh toán giống nhau. Kiểm soát nào thiếu rõ nhất?", "a": "Cơ chế chống xử lý trùng, thường dựa trên khóa định danh sự kiện hoặc idempotency.", "ex": "Webhook có thể được gửi lại; bên nhận phải nhận diện cùng một sự kiện và chỉ xử lý nghiệp vụ một lần.", "trap": "Không nên giả định mỗi Webhook chỉ đến đúng một lần."}, {"id": "H044", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "API", "priority": "S - bắt buộc", "level": 4, "q": "Một API có giới hạn 1.000 yêu cầu/phút cho mỗi đối tác. Đối tác tạo mười tài khoản kỹ thuật khác nhau để vượt giới hạn tổng thể và gây quá tải. Kiểm soát nào cần được bổ sung?", "a": "Giới hạn phải xét theo thực thể/đối tác và luồng nghiệp vụ, không chỉ theo từng tài khoản kỹ thuật.", "ex": "Rate limit ở sai cấp độ có thể bị né bằng cách chia nhỏ danh tính kỹ thuật.", "trap": "Chỉ đếm yêu cầu theo API key chưa chắc đủ."}, {"id": "H045", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "API", "priority": "S - bắt buộc", "level": 4, "q": "Một dịch vụ khởi tạo thanh toán trả HTTP 200 ngay sau khi nhận yêu cầu, nhưng giao dịch thực tế còn chờ ngân hàng xử lý vài phút. Nếu đối tác hiểu HTTP 200 là 'đã thanh toán thành công' thì lỗi thiết kế nằm ở đâu?", "a": "Lẫn lộn giữa thành công kỹ thuật của yêu cầu và trạng thái nghiệp vụ cuối cùng.", "ex": "HTTP status phản ánh xử lý yêu cầu; trạng thái thanh toán có thể cần tra cứu riêng hoặc nhận qua Webhook.", "trap": "Không dùng HTTP 200 thay cho trạng thái nghiệp vụ."}, {"id": "H046", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Bảo mật", "priority": "S - bắt buộc", "level": 4, "q": "Một API cho phép người dùng chỉnh sửa hồ sơ. Người dùng bình thường gửi thêm trường 'vai trò quản trị viên' trong dữ liệu gửi trong yêu cầu và hệ thống chấp nhận, khiến quyền của họ tăng lên. Đây gần nhất với dạng lỗi nào?", "a": "Lỗi kiểm soát thuộc tính đối tượng, cho phép cập nhật trường nhạy cảm ngoài quyền.", "ex": "Hệ thống phải xác định rõ trường nào ứng dụng gọi API được phép đọc/ghi thay vì gán tự động toàn bộ dữ liệu gửi trong yêu cầu trực tiếp vào mô hình dữ liệu.", "trap": "Không chỉ là lỗi xác thực."}, {"id": "H047", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Bảo mật", "priority": "S - bắt buộc", "level": 4, "q": "Một TPP (Third Party Provider – bên thứ ba cung cấp dịch vụ) hợp lệ bị chiếm tài khoản quản trị. Kẻ tấn công dùng chính thông tin xác thực hợp lệ để tải dữ liệu với tốc độ bất thường vào ban đêm. Vì sao xác thực mạnh vẫn chưa đủ?", "a": "Vì cần giám sát hành vi và phát hiện truy cập bất thường sau xác thực.", "ex": "Thông tin xác thực hợp lệ không chứng minh mọi hành vi sau đó là hợp lệ.", "trap": "Đừng coi authentication là điểm kết thúc của bảo mật."}, {"id": "H048", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Dữ liệu", "priority": "S - bắt buộc", "level": 4, "q": "Hai ngân hàng đều cung cấp lịch sử giao dịch. Ngân hàng A dùng mã loại giao dịch riêng, ngân hàng B dùng mô tả tự do. Một Fintech vẫn kết nối được cả hai nhưng mô hình phân loại chi tiêu sai lệch mạnh giữa hai ngân hàng. Nút thắt chính là gì?", "a": "Thiếu chuẩn hóa ngữ nghĩa và hệ phân loại dữ liệu.", "ex": "Kết nối kỹ thuật thành công chưa đảm bảo dữ liệu có thể được hiểu nhất quán.", "trap": "Không nhầm khả năng tương tác kỹ thuật với khả năng tương tác ngữ nghĩa."}, {"id": "H049", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Dữ liệu", "priority": "S - bắt buộc", "level": 4, "q": "Một ngân hàng muốn dùng dữ liệu hóa đơn, logistics và dòng tiền để chấm điểm SME. Dữ liệu logistics cập nhật nhanh nhưng nhiều trạng thái do nhân viên nhập tự do, còn dữ liệu ngân hàng chuẩn hóa tốt. Nếu mô hình không ổn định, ưu tiên đầu tiên nên là thêm nhiều biến hay cải thiện dữ liệu nguồn?", "a": "Ưu tiên cải thiện chất lượng và chuẩn hóa dữ liệu nguồn.", "ex": "Thêm nhiều biến kém chất lượng có thể tăng nhiễu và khó giải thích mô hình.", "trap": "Nhiều dữ liệu không đồng nghĩa dữ liệu tốt."}, {"id": "H050", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Fintech", "priority": "S - bắt buộc", "level": 4, "q": "Một mô hình tín dụng dùng lịch sử mua sắm trực tuyến giúp khách hàng thin-file được tiếp cận vốn, nhưng một nền tảng thương mại điện tử lớn thay đổi cách ghi nhận đơn hàng khiến điểm tín dụng của hàng nghìn khách hàng giảm đột ngột. Rủi ro mô hình nổi bật là gì?", "a": "Rủi ro phụ thuộc nguồn dữ liệu và trôi dữ liệu.", "ex": "Khi distribution hoặc cách tạo dữ liệu thay đổi, mô hình cũ có thể mất hiệu lực.", "trap": "Không phải mọi biến động điểm đều phản ánh khách hàng xấu đi."}, {"id": "H051", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Fintech", "priority": "S - bắt buộc", "level": 4, "q": "Ngân hàng dùng AI tạo sinh để đọc hợp đồng và đề xuất điều khoản rủi ro. Độ chính xác trung bình cao nhưng đôi lúc AI bỏ sót một điều khoản bảo lãnh quan trọng. Có nên tự động phê duyệt chỉ dựa trên đầu ra AI không?", "a": "Không; cần cơ chế kiểm tra nguồn và con người phê duyệt ở bước rủi ro trọng yếu.", "ex": "Sai sót hiếm nhưng hậu quả lớn không phù hợp với tự động hóa hoàn toàn.", "trap": "Độ chính xác trung bình không phản ánh rủi ro hiếm nhưng hậu quả lớn."}, {"id": "H052", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Open Finance", "priority": "S - bắt buộc", "level": 4, "q": "Một khuôn khổ Open Finance cho phép chuyển dữ liệu bảo hiểm, đầu tư và ngân hàng nhưng không thống nhất định danh khách hàng giữa các ngành. Điều gì có thể xảy ra dù API đều hoạt động đúng?", "a": "Dữ liệu có thể bị ghép sai hoặc không ghép được giữa các nhà cung cấp.", "ex": "khả năng tương tác cần cơ chế nhận diện thực thể đáng tin cậy, không chỉ API chuẩn.", "trap": "Đừng chỉ tập trung vào cấu trúc dữ liệu."}, {"id": "H053", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một ngân hàng muốn kiếm tiền từ API. Nhóm sản phẩm đề xuất thu phí mọi API, kể cả API bắt buộc phải mở theo quy định; nhóm khác đề xuất miễn phí toàn bộ. Cách tiếp cận hợp lý hơn về mặt chiến lược là gì?", "a": "Phân biệt API mang tính tuân thủ với API giá trị gia tăng và định giá theo giá trị/chi phí phù hợp từng nhóm.", "ex": "Không nên áp một mô hình giá cho mọi API.", "trap": "Miễn phí tất cả và thu phí tất cả đều bỏ qua khác biệt về mục tiêu và giá trị."}, {"id": "H054", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một Premium API giúp Fintech giảm thời gian thẩm định từ hai ngày xuống hai phút, nhưng ngân hàng định giá chỉ dựa trên chi phí máy chủ. Điểm thiếu trong cách định giá là gì?", "a": "Chưa tính đến giá trị kinh tế mà API tạo ra cho đối tác.", "ex": "Định giá theo giá trị xem xét lợi ích như giảm chi phí, tăng chuyển đổi hoặc tăng tốc doanh thu.", "trap": "Chi phí hạ tầng không phải trần giá tự nhiên."}, {"id": "H055", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một siêu ứng dụng kiểm soát toàn bộ giao diện khách hàng, còn ngân hàng cung cấp tài khoản, thanh toán và tín dụng phía sau thông qua API. Doanh thu vẫn tăng ngắn hạn nhưng ngân hàng mất dữ liệu hành vi trực tiếp. Rủi ro dài hạn là gì?", "a": "Suy giảm quyền sở hữu quan hệ khách hàng và khả năng khác biệt hóa.", "ex": "Ngân hàng có thể bị commoditize nếu chỉ còn là nhà cung cấp năng lực phía sau.", "trap": "Doanh thu ngắn hạn không loại bỏ rủi ro chiến lược dài hạn."}, {"id": "H056", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Open Banking", "priority": "S - bắt buộc", "level": 4, "q": "Một nước triển khai Open Banking theo hướng tự nguyện. Ba ngân hàng lớn dùng ba chuẩn API khác nhau; các ngân hàng nhỏ chưa mở API. Fintech phải tích hợp riêng từng bên. Đây là bằng chứng rõ nhất của vấn đề gì?", "a": "Thiếu chuẩn chung và thiếu khả năng tương tác toàn thị trường.", "ex": "Mô hình market-led có thể đổi mới nhanh ở từng doanh nghiệp nhưng dễ phân mảnh nếu không có tiêu chuẩn phối hợp.", "trap": "Không phải chỉ là thiếu số lượng API."}, {"id": "H057", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Open Banking", "priority": "S - bắt buộc", "level": 4, "q": "Một nước áp chuẩn API thống nhất nhưng quy trình onboarding TPP (Third Party Provider – bên thứ ba cung cấp dịch vụ) ở mỗi ngân hàng lại mất từ một tuần đến sáu tháng. Vì sao chuẩn kỹ thuật chưa đủ để tạo Open Banking hiệu quả?", "a": "Vì còn phụ thuộc quy trình vận hành, thẩm định đối tác, tài liệu, môi trường thử nghiệm và SLA (Service Level Agreement – thỏa thuận mức dịch vụ).", "ex": "khả năng tương tác kỹ thuật không tự giải quyết operational ma sát trải nghiệm.", "trap": "Chuẩn dữ liệu gửi trong yêu cầu giống nhau chưa có nghĩa thời gian đưa sản phẩm ra thị trường giống nhau."}, {"id": "H058", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Rủi ro hệ thống", "priority": "A - rất nên biết", "level": 4, "q": "Một trung tâm định danh duy nhất được mọi ngân hàng và Fintech dùng để xác thực người dùng. Trung tâm này giảm chi phí tích hợp nhưng khi bị tấn công, hàng chục dịch vụ cùng ngừng hoạt động. Hai mặt của thiết kế này là gì?", "a": "Hiệu quả chuẩn hóa cao nhưng tăng rủi ro tập trung và điểm lỗi chung.", "ex": "Thiết kế tập trung có thể cải thiện tính nhất quán nhưng làm tăng phạm vi ảnh hưởng khi xảy ra sự cố khi xảy ra sự cố.", "trap": "Không có kiến trúc nào chỉ có lợi ích."}, {"id": "H059", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Ngân hàng", "priority": "A - rất nên biết", "level": 4, "q": "Ngân hàng có danh mục cho vay lãi suất cố định 3 năm, trong khi phần lớn tiền gửi được tái định giá trong ba tháng. Lãi suất thị trường tăng 2 điểm phần trăm. Kênh tác động trực tiếp đầu tiên tới lợi nhuận lãi là gì?", "a": "Chi phí vốn tăng nhanh hơn thu nhập từ tài sản cố định, làm biên lãi chịu áp lực.", "ex": "Đây là chênh lệch thời điểm tái định giá giữa tài sản và nguồn vốn.", "trap": "Không cần khách hàng vỡ nợ thì lợi nhuận lãi vẫn có thể giảm."}, {"id": "H060", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Ngân hàng", "priority": "A - rất nên biết", "level": 4, "q": "Một ngân hàng tăng mạnh dư nợ nhờ giảm chuẩn tín dụng; NIM (Net Interest biên lợi nhuận – biên lãi ròng) tăng và lợi nhuận quý hiện tại đẹp hơn. Chỉ nhìn NIM để kết luận chiến lược tốt có thiếu sót gì?", "a": "Bỏ qua chất lượng tài sản và tổn thất tín dụng tương lai.", "ex": "NIM cao có thể đi cùng rủi ro tín dụng cao hơn.", "trap": "Một KPI lợi nhuận không phản ánh đầy đủ risk-adjusted return."}, {"id": "H061", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Doanh nghiệp", "priority": "A - rất nên biết", "level": 4, "q": "Doanh nghiệp giảm DSO (Days Sales Outstanding – số ngày thu tiền bình quân) nhờ khách hàng trả sớm hơn nhưng đồng thời phải thanh toán nhà cung cấp sớm hơn đúng số ngày tương ứng. Tác động lên chu kỳ chuyển đổi tiền mặt có chắc chắn cải thiện không?", "a": "Không chắc; nếu DSO và DPO (Days Payables Outstanding – số ngày thanh toán nhà cung cấp bình quân) cùng giảm bằng nhau thì tác động có thể triệt tiêu.", "ex": "CCC = DIO + DSO - DPO. Giảm DSO tốt nhưng giảm DPO lại làm CCC tăng.", "trap": "Đừng nhìn riêng DSO."}, {"id": "H062", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Tài trợ thương mại", "priority": "A - rất nên biết", "level": 4, "q": "Doanh nghiệp xuất khẩu có khoản phải thu 60 ngày nhưng đã được ngân hàng tài trợ 95% từ trước. Nền tảng mới giúp gửi hồ sơ nhanh hơn nhưng không làm tăng hạn mức. KPI nào phản ánh giá trị tốt hơn 'tổng số tiền giải ngân qua nền tảng'?", "a": "Thời gian xử lý, tỷ lệ tự động hóa, chi phí vận hành hoặc phần giải ngân tăng thêm thực sự.", "ex": "Tổng luồng vốn có thể lớn nhưng không chứng minh nền tảng tạo thêm vốn.", "trap": "Đừng gọi toàn bộ luồng là tài trợ tăng thêm."}, {"id": "H063", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Tài trợ thương mại", "priority": "A - rất nên biết", "level": 4, "q": "Một hệ thống thấy sự kiện 'hàng đã giao' và tự thông báo 'khoản vay đã được phê duyệt' dù ngân hàng chưa KYC, chưa thẩm định tín dụng và chưa quyết định hạn mức. Sai logic nằm ở đâu?", "a": "Sự kiện thương mại chỉ có thể kích hoạt quy trình, không thay thế quyết định tín dụng của ngân hàng.", "ex": "Event-driven orchestration không đồng nghĩa tự động phê duyệt tài trợ.", "trap": "Đừng nhầm trigger với thẩm định và phê duyệt tín dụng."}, {"id": "H064", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Ngoại hối", "priority": "A - rất nên biết", "level": 4, "q": "Doanh nghiệp sẽ thu USD sau 90 ngày. Họ chỉ hedge 70% vì vẫn muốn hưởng lợi nếu USD tăng. Sau đó USD giảm mạnh. Vì sao doanh nghiệp vẫn chịu một phần tổn thất dù đã dùng hợp đồng kỳ hạn?", "a": "Vì 30% dòng tiền còn lại không được phòng vệ.", "ex": "Hedge ratio quyết định mức độ bảo vệ và mức độ còn mở với biến động tỷ giá.", "trap": "Hedge không nhất thiết là 100%."}, {"id": "H065", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Đối soát", "priority": "A - rất nên biết", "level": 4, "q": "Tiền vào khớp chính xác số tiền hóa đơn nhưng tên người trả và mã tham chiếu không khớp. Hệ thống tự động đóng hóa đơn chỉ dựa trên số tiền. Rủi ro chính là gì?", "a": "Đối soát nhầm giao dịch và cập nhật sai trạng thái khoản phải thu.", "ex": "Một tiêu chí khớp duy nhất có thể gây false positive.", "trap": "Khớp số tiền không đủ trong môi trường có nhiều hóa đơn cùng giá trị."}, {"id": "H066", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Open Banking", "priority": "S - bắt buộc", "level": 4, "q": "Một khách hàng cho phép ứng dụng bên thứ ba đọc giao dịch trong 90 ngày để lập ngân sách. Ứng dụng sau đó chuyển toàn bộ dữ liệu sang một đối tác khác để chấm điểm bảo hiểm mà không thông báo thêm. Điểm kiểm soát nào cần xem xét trước?", "a": "Phạm vi và mục đích chia sẻ tiếp dữ liệu cho bên khác.", "ex": "Consent ban đầu cho quản lý ngân sách không tự động bao phủ mọi hoạt động chia sẻ tiếp.", "trap": "Đừng chỉ hỏi dữ liệu có được lấy hợp lệ từ ngân hàng hay không."}, {"id": "H067", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Open Banking", "priority": "S - bắt buộc", "level": 4, "q": "Ngân hàng cho phép khách hàng xem danh sách các consent đã cấp nhưng không có chức năng rút lại trực tuyến. Về trải nghiệm và quyền kiểm soát, điểm thiếu lớn nhất là gì?", "a": "Khách hàng chưa có công cụ thực tế để quản lý và rút lại sự đồng ý.", "ex": "Transparency chỉ có giá trị khi đi cùng quyền kiểm soát.", "trap": "Hiển thị thông tin không thay thế khả năng hành động."}, {"id": "H068", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "API", "priority": "S - bắt buộc", "level": 4, "q": "Một API thanh toán luôn thử lại ngay lập tức năm lần khi hệ thống phụ thuộc phía sau lỗi. Trong giờ cao điểm, lỗi nhỏ biến thành quá tải toàn hệ thống. Thiết kế thử lại nên thay đổi thế nào?", "a": "Giãn khoảng thời gian thử lại, giới hạn số lần và kết hợp cơ chế ngắt mạch.", "ex": "Thử lại dồn dập có thể khuếch đại sự cố thành bão thử lại.", "trap": "Nhiều thử lại không đồng nghĩa khả năng chống chịu tốt hơn."}, {"id": "H069", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "API", "priority": "S - bắt buộc", "level": 4, "q": "Một đối tác tích hợp API theo tài liệu phiên bản 1.0. Ngân hàng đổi tên trường bắt buộc trong phiên bản đang chạy mà không báo trước, khiến hệ thống đối tác lỗi hàng loạt. Nguyên tắc quản lý API nào bị vi phạm?", "a": "Quản lý phiên bản và tương thích ngược.", "ex": "Thay đổi phá vỡ contract phải được versioning và truyền thông phù hợp.", "trap": "Không phải lỗi của đối tác chỉ vì họ dùng đúng tài liệu đã công bố."}, {"id": "H070", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "API", "priority": "S - bắt buộc", "level": 4, "q": "Một luồng xử lý cần hai phút để hoàn tất nhưng giao diện người dùng giữ kết nối chờ suốt hai phút và thường bị timeout. Kiến trúc nào hợp lý hơn?", "a": "Xử lý bất đồng bộ, trả mã theo dõi và cung cấp cơ chế tra cứu hoặc Webhook khi hoàn tất.", "ex": "Tác vụ dài không nên buộc ứng dụng gọi API chờ kết nối đồng bộ.", "trap": "Không phải tăng timeout vô hạn là giải pháp tốt."}, {"id": "H071", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Bảo mật", "priority": "S - bắt buộc", "level": 4, "q": "Một API kiểm tra rằng người dùng đã đăng nhập nhưng không kiểm tra trường dữ liệu nào họ được phép cập nhật. Người dùng sửa được hạn mức tín dụng trong hồ sơ của chính mình. Lỗi cốt lõi ở đâu?", "a": "Thiếu phân quyền ở cấp thuộc tính dữ liệu.", "ex": "Người dùng có quyền với hồ sơ không có nghĩa được chỉnh mọi trường trong hồ sơ.", "trap": "Quyền cấp đối tượng và quyền cấp thuộc tính khác nhau."}, {"id": "H072", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Bảo mật", "priority": "S - bắt buộc", "level": 4, "q": "Một ngân hàng bắt buộc xác thực đa yếu tố nhưng cho phép reset yếu tố thứ hai chỉ bằng câu hỏi bảo mật dễ đoán. Điểm yếu lớn nhất là gì?", "a": "Quy trình khôi phục yếu làm vô hiệu lợi ích của xác thực đa yếu tố.", "ex": "Security mạnh bằng mắt xích yếu nhất trong vòng đời thông tin xác thực.", "trap": "Không chỉ kiểm tra quy trình đăng nhập; phải kiểm tra quy trình khôi phục."}, {"id": "H073", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Bảo mật", "priority": "S - bắt buộc", "level": 4, "q": "Một TPP (Third Party Provider – bên thứ ba cung cấp dịch vụ) được đưa vào danh sách cho phép địa chỉ IP nên ngân hàng bỏ qua kiểm tra danh tính ứng dụng ở mỗi yêu cầu. Nếu máy chủ TPP bị chiếm quyền, thiết kế này có vấn đề gì?", "a": "Đang mặc định tin cậy dựa trên vị trí mạng thay vì tiếp tục xác thực và phân quyền.", "ex": "IP danh sách cho phép có thể là lớp bổ sung nhưng không nên thay thế kiểm soát dựa trên danh tính.", "trap": "Không coi nguồn mạng là bằng chứng đủ về danh tính."}, {"id": "H074", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Dữ liệu", "priority": "S - bắt buộc", "level": 4, "q": "Một ngân hàng muốn cá nhân hóa gợi ý chi tiêu bằng dữ liệu giao dịch. Mô hình tốt trên dữ liệu lịch sử nhưng sau khi ngân hàng đổi cách phân loại merchant, độ chính xác giảm mạnh. Bước kiểm soát nào quan trọng nhất?", "a": "Theo dõi thay đổi phân phối dữ liệu và hiệu năng mô hình sau triển khai.", "ex": "Giám sát mô hình phải phát hiện sự trôi dữ liệu và thay đổi hệ phân loại ở nguồn dữ liệu.", "trap": "Không thể giả định dữ liệu đầu vào bất biến."}, {"id": "H075", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Dữ liệu", "priority": "S - bắt buộc", "level": 4, "q": "Một hệ thống tổng hợp dữ liệu từ năm ngân hàng nhưng mỗi ngân hàng dùng múi giờ và quy tắc ngày ghi sổ khác nhau. Khi xếp chuỗi giao dịch, nhiều sự kiện bị đảo thứ tự. Cần chuẩn hóa gì?", "a": "Chuẩn thời gian, múi giờ và quy tắc timestamp.", "ex": "Dữ liệu cùng định dạng nhưng khác cách hiểu thời gian vẫn gây lỗi phân tích.", "trap": "Đây là vấn đề ngữ nghĩa và siêu dữ liệu, không chỉ là định dạng."}, {"id": "H076", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Open Finance", "priority": "S - bắt buộc", "level": 4, "q": "Một nền tảng muốn cho phép người dùng chuyển toàn bộ dữ liệu tài chính sang nhà cung cấp khác. Nếu chỉ có quyền truy cập nhưng không có chuẩn dữ liệu chung, khả năng chuyển dữ liệu có thực sự hiệu quả không?", "a": "Không; quyền truy cập cần đi cùng khả năng dữ liệu được hiểu và sử dụng ở hệ thống đích.", "ex": "Khả năng chuyển dữ liệu không chỉ là sao chép dữ liệu thô mà còn đòi hỏi hệ thống đích hiểu và sử dụng được dữ liệu.", "trap": "Có quyền truy cập nhưng thiếu chuẩn hóa vẫn có thể tạo ra dữ liệu khó dùng."}, {"id": "H077", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Open Finance", "priority": "S - bắt buộc", "level": 4, "q": "Một cơ chế chia sẻ dữ liệu được thiết kế để tăng cạnh tranh nhưng chỉ các Big Tech lớn đủ nguồn lực đáp ứng chuẩn kỹ thuật phức tạp. Hệ quả cạnh tranh có thể ngược mục tiêu thế nào?", "a": "Rào cản tuân thủ cao có thể củng cố lợi thế của doanh nghiệp lớn và loại đối thủ nhỏ.", "ex": "Quy định thúc đẩy cạnh tranh vẫn có thể tạo chi phí tuân thủ cố định lớn.", "trap": "Không mặc định chuẩn càng phức tạp càng an toàn và công bằng."}, {"id": "H078", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một ngân hàng có API cho đối tác nhưng yêu cầu mọi sản phẩm phải mang thương hiệu ngân hàng ở vị trí nổi bật. Điều này bảo vệ brand nhưng khiến đối tác khó tạo trải nghiệm liền mạch. Đây là đánh đổi giữa hai mục tiêu nào?", "a": "Kiểm soát thương hiệu/quan hệ khách hàng và khả năng nhúng dịch vụ vào trải nghiệm đối tác.", "ex": "Embedded Finance cần cân bằng brand visibility với ma sát trải nghiệmless journey.", "trap": "Không phải lúc nào đồng thương hiệu tối đa cũng tạo mức độ sử dụng tối đa."}, {"id": "H079", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Ngân hàng A miễn phí API để thu hút nhiều Fintech; ngân hàng B thu phí nhưng cung cấp dữ liệu giàu hơn, SLA (Service Level Agreement – thỏa thuận mức dịch vụ) tốt hơn và hỗ trợ tích hợp. Không thể kết luận mô hình nào tốt hơn chỉ từ giá vì sao?", "a": "Vì giá trị phụ thuộc chất lượng dịch vụ, dữ liệu, mức sử dụng và hiệu quả kinh doanh tạo ra.", "ex": "API product phải đánh giá total giá trị chứ không chỉ giá.", "trap": "Miễn phí không đồng nghĩa mức độ sử dụng hiệu quả."}, {"id": "H080", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một Fintech tăng rất nhanh số người đăng ký nhờ trợ giá nhưng tỷ lệ người dùng hoạt động sau ba tháng rất thấp. Chỉ số nào cần ưu tiên hơn để đánh giá mô hình bền vững?", "a": "Tỷ lệ duy trì/hoạt động thực tế và giá trị vòng đời khách hàng.", "ex": "Thu hút người dùng cao nhưng duy trì người dùng thấp có thể làm hiệu quả kinh tế trên một đơn vị xấu.", "trap": "Đừng chỉ nhìn số đăng ký."}, {"id": "H081", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Fintech", "priority": "S - bắt buộc", "level": 4, "q": "Một mô hình chấm điểm tín dụng mới tăng approval cho nhóm chưa có lịch sử tín dụng nhưng default cũng tăng mạnh. Để đánh giá giá trị thực, cần so sánh điều gì ngoài approval rate?", "a": "Tổn thất tín dụng và lợi nhuận điều chỉnh theo rủi ro của phần khách hàng được duyệt thêm.", "ex": "Financial inclusion có ý nghĩa khi khả năng tiếp cận tăng mà rủi ro vẫn được quản lý.", "trap": "Approval cao không tự động tốt."}, {"id": "H082", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Fintech", "priority": "S - bắt buộc", "level": 4, "q": "Một mô hình chống gian lận giảm false negative nhưng false positive tăng gấp đôi, khiến nhiều giao dịch tốt bị chặn. Có thể gọi mô hình tốt hơn chỉ vì bắt được nhiều gian lận hơn không?", "a": "Không; phải đánh đổi giữa phát hiện gian lận và tổn thất trải nghiệm/doanh thu do chặn nhầm.", "ex": "Risk mô hình dữ liệu luôn có trade-off precision/recall và business cost.", "trap": "Tối ưu một loại lỗi có thể làm loại lỗi kia xấu đi."}, {"id": "H083", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Ngân hàng", "priority": "A - rất nên biết", "level": 4, "q": "Ngân hàng có ROE (Return on Equity – tỷ suất sinh lời trên vốn chủ sở hữu) tăng từ 15% lên 22% nhưng vốn chủ sở hữu giảm mạnh trong khi lợi nhuận gần như không đổi. Có thể kết luận hiệu quả kinh doanh cải thiện tương ứng không?", "a": "Không chắc; ROE có thể tăng do mẫu số vốn giảm chứ không phải lợi nhuận tốt hơn.", "ex": "Ratio phải được đọc cùng driver.", "trap": "Chỉ nhìn tỷ lệ dễ dẫn đến kết luận sai."}, {"id": "H084", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Ngân hàng", "priority": "A - rất nên biết", "level": 4, "q": "Một ngân hàng giảm mạnh tiền gửi không kỳ hạn nhưng giữ nguyên tổng tiền gửi bằng cách tăng tiền gửi kỳ hạn lãi suất cao. Tác động có khả năng xảy ra lên chi phí vốn và NIM (Net Interest biên lợi nhuận – biên lãi ròng) là gì?", "a": "Chi phí vốn có xu hướng tăng và NIM chịu áp lực giảm nếu lợi suất tài sản không tăng tương ứng.", "ex": "Cơ cấu nguồn vốn thay đổi quan trọng, không chỉ tổng quy mô.", "trap": "Tổng tiền gửi không đổi không có nghĩa cost of fund không đổi."}, {"id": "H085", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Doanh nghiệp", "priority": "A - rất nên biết", "level": 4, "q": "Doanh nghiệp rút ngắn thời gian thu tiền 10 ngày nhưng phải tăng tồn kho thêm 14 ngày để đáp ứng đơn hàng nhanh hơn; thời gian trả nhà cung cấp không đổi. Chu kỳ chuyển đổi tiền mặt cải thiện hay xấu đi?", "a": "Xấu đi 4 ngày.", "ex": "CCC thay đổi = +14 ngày tồn kho -10 ngày thu tiền = +4 ngày.", "trap": "Đừng chỉ nhìn một KPI vốn lưu động."}, {"id": "H086", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Tài trợ thương mại", "priority": "A - rất nên biết", "level": 4, "q": "Ngân hàng cung cấp ứng trước 80% khoản phải thu. Doanh nghiệp đề nghị nâng lên 95% để có thêm tiền mặt, nhưng dữ liệu buyer chưa đủ và dispute rate cao. Vì sao tăng tỷ lệ ứng trước không chỉ là quyết định bán hàng?", "a": "Vì làm tăng mức phơi nhiễm và tổn thất tiềm năng khi khoản phải thu không thu được.", "ex": "tỷ lệ ứng trước là biến quản trị rủi ro chứ không chỉ đòn bẩy tăng chuyển đổi.", "trap": "Nhiều tiền ứng trước hơn không miễn phí về risk."}, {"id": "H087", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Ngoại hối", "priority": "A - rất nên biết", "level": 4, "q": "Doanh nghiệp xuất khẩu có cả doanh thu USD và chi phí nhập khẩu USD cùng kỳ. Trước khi mua hợp đồng kỳ hạn cho toàn bộ doanh thu, nên xem xét điều gì?", "a": "Phần phơi nhiễm ròng sau khi bù trừ dòng tiền USD tự nhiên.", "ex": "phòng vệ tự nhiên có thể giảm nhu cầu giao dịch phái sinh.", "trap": "Hedge tổng mức phơi nhiễm có thể dẫn đến phòng vệ vượt quá mức phơi nhiễm."}, {"id": "H088", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Đối soát", "priority": "A - rất nên biết", "level": 4, "q": "Hệ thống đối soát tự động đạt 98% nhưng 2% ngoại lệ lại chiếm 60% thời gian của đội vận hành. KPI nào cần theo dõi thêm ngoài tỷ lệ tự động hóa?", "a": "Thời gian và chi phí xử lý ngoại lệ, cùng nguyên nhân gây ngoại lệ.", "ex": "Một tỷ lệ STP cao vẫn có thể che giấu tail workload lớn.", "trap": "Đừng chỉ nhìn percentage automated."}, {"id": "H089", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Rủi ro hệ thống", "priority": "A - rất nên biết", "level": 4, "q": "Một API trung tâm được thiết kế dự phòng ở hai trung tâm dữ liệu nhưng cả hai cùng phụ thuộc một nhà cung cấp DNS. Nếu DNS lỗi, toàn hệ thống vẫn dừng. Bài học kiến trúc là gì?", "a": "Dự phòng hình thức không đủ nếu còn phụ thuộc chung ở lớp khác.", "ex": "Khả năng chống chịu phải phân tích thành phần phụ thuộc chain và sự cố do phụ thuộc chung.", "trap": "Hai data center chưa chắc độc lập thực sự."}, {"id": "H090", "part": "B - Chặng 2 tình huống", "type": "Tình huống 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một nền tảng ngân hàng số tăng số đối tác API rất nhanh nhưng mỗi đối tác chỉ tạo vài giao dịch. Trong khi đó một đối tác lớn tạo 70% sản lượng. Rủi ro kinh doanh cần nhìn đồng thời là gì?", "a": "Phụ thuộc tập trung vào đối tác lớn dù số lượng đối tác bề ngoài đa dạng.", "ex": "Số lượng đối tác không phản ánh concentration của revenue/sản lượng.", "trap": "Nhiều logo không đồng nghĩa diversification."}, {"id": "H091", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Vốn lưu động", "priority": "S - bắt buộc", "level": 3, "q": "Doanh thu năm của doanh nghiệp là 91,25 tỷ đồng. DSO (Days Sales Outstanding – số ngày thu tiền bình quân) giảm từ 54 xuống 46 ngày, giả sử doanh thu phân bổ đều trong năm. Lượng vốn lưu động được giải phóng xấp xỉ bao nhiêu?", "a": "Khoảng 2 tỷ đồng.", "ex": "Doanh thu/ngày = 91,25/365 = 0,25 tỷ đồng; giảm 8 ngày × 0,25 = 2 tỷ đồng.", "trap": "Dễ lấy 54-46 sai dấu hoặc chia cho 12 thay vì 365."}, {"id": "H092", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Tài trợ khoản phải thu", "priority": "S - bắt buộc", "level": 4, "q": "Một hóa đơn trị giá 1,5 tỷ đồng, chỉ 85% giá trị đủ điều kiện tài trợ. Ngân hàng ứng trước 80% phần đủ điều kiện. Phí nền tảng bằng 0,15% số tiền giải ngân. Tiền giải ngân và phí lần lượt là bao nhiêu?", "a": "1,02 tỷ đồng và 1,53 triệu đồng.", "ex": "Giá trị đủ điều kiện = 1,5 × 85% = 1,275 tỷ; giải ngân = 1,275 × 80% = 1,02 tỷ; phí = 1,02 tỷ × 0,15% = 1,53 triệu.", "trap": "Bẫy là tính tỷ lệ ứng trước hoặc phí trên toàn bộ invoice."}, {"id": "H093", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Funnel", "priority": "S - bắt buộc", "level": 4, "q": "Có 120 hóa đơn. 70% đủ điều kiện, 45% trong số đó được doanh nghiệp gửi yêu cầu, và 60% yêu cầu được chấp thuận. Số khoản giải ngân kỳ vọng là bao nhiêu?", "a": "Khoảng 22,7 khoản, tức xấp xỉ 23 khoản.", "ex": "120 × 70% × 45% × 60% = 22,68.", "trap": "Không cộng các tỷ lệ; phải nhân theo từng tầng funnel."}, {"id": "H094", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Ngân hàng", "priority": "S - bắt buộc", "level": 3, "q": "Dư nợ cho vay ban đầu 880 tỷ đồng và tiền gửi 1.000 tỷ đồng. Sau đó dư nợ tăng thêm 150 tỷ, tiền gửi tăng thêm 50 tỷ. Tỷ lệ dư nợ trên tiền gửi thay đổi từ bao nhiêu lên khoảng bao nhiêu?", "a": "Từ 88% lên khoảng 98,1%.", "ex": "Ban đầu 880/1.000 = 88%; sau đó 1.030/1.050 ≈ 98,1%.", "trap": "Dễ chỉ cộng 15 điểm phần trăm mà không tính lại mẫu số."}, {"id": "H095", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Ngân hàng", "priority": "S - bắt buộc", "level": 3, "q": "Thu nhập lãi của ngân hàng là 90 tỷ đồng, chi phí lãi 45 tỷ đồng, tài sản sinh lãi bình quân 1.500 tỷ đồng. NIM (Net Interest biên lợi nhuận – biên lãi ròng) xấp xỉ bao nhiêu?", "a": "3%.", "ex": "Thu nhập lãi thuần = 90 - 45 = 45 tỷ; NIM = 45/1.500 = 3%.", "trap": "Không lấy 90/1.500."}, {"id": "H096", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Rủi ro tín dụng", "priority": "A - rất nên biết", "level": 4, "q": "Một danh mục có xác suất vỡ nợ 2%, tỷ lệ tổn thất khi vỡ nợ 45%, và dư nợ tại thời điểm vỡ nợ 10 tỷ đồng. Tổn thất kỳ vọng là bao nhiêu?", "a": "90 triệu đồng.", "ex": "10 tỷ × 2% × 45% = 0,09 tỷ = 90 triệu đồng.", "trap": "Đừng cộng PD và LGD."}, {"id": "H097", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "SLA", "priority": "A - rất nên biết", "level": 3, "q": "Một dịch vụ ngừng hoạt động tổng cộng 43,2 phút trong 30 ngày. Giả sử tháng có 43.200 phút. Mức sẵn sàng xấp xỉ bao nhiêu?", "a": "99,9%.", "ex": "tính sẵn sàng = 1 - 43,2/43.200 = 99,9%.", "trap": "Dễ nhầm downtime 0,1% thành tính sẵn sàng 0,1%."}, {"id": "H098", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Ngoại hối", "priority": "S - bắt buộc", "level": 3, "q": "Doanh nghiệp sẽ thu 200.000 USD sau 60 ngày. Tỷ giá kỳ hạn bán USD là 25.800 VND/USD. Nếu đến ngày thu tiền tỷ giá giao ngay chỉ còn 25.100, hợp đồng kỳ hạn giúp doanh nghiệp tránh mất bao nhiêu VND so với không hedge?", "a": "140 triệu đồng.", "ex": "Chênh lệch 700 VND/USD × 200.000 USD = 140 triệu đồng.", "trap": "Không cần tính toàn bộ doanh thu VND nếu câu hỏi chỉ hỏi phần chênh lệch."}, {"id": "H099", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Lãi suất", "priority": "A - rất nên biết", "level": 3, "q": "Doanh nghiệp vay 5 tỷ đồng trong 45 ngày với lãi suất đơn 8%/năm, quy ước 365 ngày. Tiền lãi xấp xỉ bao nhiêu?", "a": "Khoảng 49,3 triệu đồng.", "ex": "5 tỷ × 8% × 45/365 ≈ 49,3 triệu.", "trap": "Dễ dùng 45/12 thay vì 45/365."}, {"id": "H100", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Vốn lưu động", "priority": "S - bắt buộc", "level": 3, "q": "DIO (Days Inventory Outstanding – số ngày tồn kho bình quân) là 30 ngày, DSO (Days Sales Outstanding – số ngày thu tiền bình quân) 45 ngày và DPO (Days Payables Outstanding – số ngày thanh toán nhà cung cấp bình quân) 25 ngày. Nếu DSO giảm 8 ngày, các yếu tố khác không đổi, CCC (Cash tỷ lệ chuyển đổi Cycle – chu kỳ chuyển đổi tiền mặt) mới là bao nhiêu?", "a": "42 ngày.", "ex": "CCC ban đầu = 30 + 45 - 25 = 50 ngày; DSO giảm còn 37 nên CCC = 30 + 37 - 25 = 42.", "trap": "Dễ quên DPO bị trừ."}, {"id": "H101", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Điểm hòa vốn", "priority": "A - rất nên biết", "level": 4, "q": "Một sản phẩm API có chi phí cố định 600 triệu đồng/tháng. Doanh thu bình quân mỗi khách hàng là 3 triệu đồng/tháng, chi phí biến đổi 1,2 triệu đồng. Cần tối thiểu khoảng bao nhiêu khách hàng để hòa vốn?", "a": "Khoảng 334 khách hàng.", "ex": "Lãi góp mỗi khách hàng = 3 - 1,2 = 1,8 triệu; 600/1,8 = 333,3 nên cần làm tròn lên 334.", "trap": "Bẫy là lấy 600/3 và bỏ qua chi phí biến đổi."}, {"id": "H102", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Tăng trưởng", "priority": "A - rất nên biết", "level": 3, "q": "Số người dùng hoạt động hàng tháng tăng từ 20.000 lên 27.000. Tốc độ tăng trưởng là bao nhiêu?", "a": "35%.", "ex": "(27.000 - 20.000)/20.000 = 35%.", "trap": "Không lấy 7.000/27.000."}, {"id": "H103", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Chất lượng dịch vụ", "priority": "A - rất nên biết", "level": 3, "q": "Trong 1.000 yêu cầu API, 950 yêu cầu thành công, 30 lỗi do ứng dụng gọi API gửi sai dữ liệu và 20 lỗi do máy chủ. Tỷ lệ thành công là bao nhiêu?", "a": "95%.", "ex": "950/1.000 = 95%.", "trap": "Câu hỏi chỉ hỏi tỷ lệ thành công nên không cần loại lỗi ứng dụng gọi API ra khỏi mẫu số."}, {"id": "H104", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Kinh tế API", "priority": "A - rất nên biết", "level": 4, "q": "Một nền tảng xử lý 10 triệu lượt gọi API/tháng. Chi phí biến đổi bình quân 20 đồng/lượt và chi phí cố định 300 triệu đồng/tháng. Chi phí bình quân trên mỗi lượt gọi là bao nhiêu?", "a": "50 đồng/lượt.", "ex": "Chi phí biến đổi = 10 triệu × 20 = 200 triệu; tổng chi phí = 500 triệu; bình quân = 500 triệu/10 triệu = 50 đồng.", "trap": "Đừng lấy riêng chi phí biên 20 đồng làm chi phí bình quân."}, {"id": "H105", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Kinh tế API", "priority": "A - rất nên biết", "level": 4, "q": "Một API thu 100 đồng/lượt, chi phí biến đổi 25 đồng/lượt và có 4 triệu lượt gọi/tháng. Chi phí cố định là 200 triệu đồng/tháng. Lợi nhuận trước các chi phí khác là bao nhiêu?", "a": "100 triệu đồng/tháng.", "ex": "Doanh thu = 400 triệu; biến phí = 100 triệu; trừ chi phí cố định 200 triệu còn 100 triệu.", "trap": "Dễ bỏ qua chi phí cố định hoặc nhân sai đơn vị triệu lượt."}, {"id": "H106", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "LTV", "priority": "A - rất nên biết", "level": 4, "q": "Một dịch vụ thu 1 triệu đồng/người dùng/tháng, biên lợi nhuận gộp 80%, tỷ lệ rời bỏ hàng tháng ổn định 4%. Dùng công thức đơn giản giá trị vòng đời khách hàng ≈ lợi nhuận gộp tháng/tỷ lệ rời bỏ tháng, giá trị vòng đời khách hàng xấp xỉ bao nhiêu?", "a": "Khoảng 20 triệu đồng.", "ex": "Lợi nhuận gộp tháng = 0,8 triệu; 0,8/0,04 = 20 triệu.", "trap": "Không lấy doanh thu 1 triệu chia tỷ lệ rời bỏ nếu công thức dùng biên lợi nhuận gộp."}, {"id": "H107", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Funnel", "priority": "S - bắt buộc", "level": 4, "q": "Một ngân hàng có 5.000 người bắt đầu luồng consent. 80% hoàn tất xác thực, 75% trong số đó cấp consent, và 60% người đã cấp consent dùng dịch vụ ít nhất một lần. Có bao nhiêu người dùng kích hoạt?", "a": "1.800 người.", "ex": "5.000 × 80% × 75% × 60% = 1.800.", "trap": "Không nhân 80%+75%+60%; đây là funnel nối tiếp."}, {"id": "H108", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Ngoại hối", "priority": "S - bắt buộc", "level": 4, "q": "Doanh nghiệp sẽ thu 500.000 USD. Họ hedge 60% ở tỷ giá 25.500 VND/USD; 40% còn lại bán theo tỷ giá giao ngay 24.800. Tỷ giá bình quân thực nhận là bao nhiêu?", "a": "25.220 VND/USD.", "ex": "25.500 × 60% + 24.800 × 40% = 25.220.", "trap": "Đừng lấy trung bình cộng đơn giản 25.150 vì tỷ trọng khác nhau."}, {"id": "H109", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Ngân hàng", "priority": "S - bắt buộc", "level": 3, "q": "Ngân hàng có 40 tỷ đồng nợ xấu trên tổng dư nợ 1.000 tỷ đồng. Tỷ lệ nợ xấu là bao nhiêu?", "a": "4%.", "ex": "40/1.000 = 4%.", "trap": "Đơn giản nhưng phải phân biệt tỷ lệ với giá trị tuyệt đối."}, {"id": "H110", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Ngân hàng", "priority": "S - bắt buộc", "level": 3, "q": "Lợi nhuận ròng 120 tỷ đồng, tài sản bình quân 6.000 tỷ và vốn chủ sở hữu bình quân 1.000 tỷ. ROA (Return on Assets – tỷ suất sinh lời trên tài sản) và ROE (Return on Equity – tỷ suất sinh lời trên vốn chủ sở hữu) lần lượt là bao nhiêu?", "a": "ROA 2% và ROE 12%.", "ex": "120/6.000 = 2%; 120/1.000 = 12%.", "trap": "Dễ đảo mẫu số."}, {"id": "H111", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Tài trợ khoản phải thu", "priority": "S - bắt buộc", "level": 4, "q": "Một khoản phải thu 1 tỷ đồng được ứng trước 80%. Phí giao dịch là 0,8% trên số tiền ứng trước và lãi suất tài trợ 9%/năm trong 60 ngày, quy ước 365 ngày. Tổng phí và lãi xấp xỉ bao nhiêu?", "a": "Khoảng 18,24 triệu đồng.", "ex": "Ứng trước 800 triệu; phí = 6,4 triệu; lãi = 800 triệu × 9% × 60/365 ≈ 11,84 triệu; tổng ≈ 18,24 triệu.", "trap": "Phí và lãi có thể có cơ sở tính khác nhau."}, {"id": "H112", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "API", "priority": "A - rất nên biết", "level": 4, "q": "Một hệ thống cho phép 600 yêu cầu/phút. Ba đối tác cùng gửi 250 yêu cầu/phút. Nếu phân bổ cứng tổng quota 600 và nhu cầu là 750, có bao nhiêu yêu cầu/phút vượt giới hạn?", "a": "150 yêu cầu/phút.", "ex": "750 - 600 = 150.", "trap": "Đừng tính 50 × 3 nếu quota không phải 200/đối tác."}, {"id": "H113", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Chất lượng dữ liệu", "priority": "A - rất nên biết", "level": 4, "q": "SLA (Service Level Agreement – thỏa thuận mức dịch vụ) yêu cầu 95% sự kiện phải đến trong 60 giây. Trong 2.000 sự kiện, có 120 sự kiện đến muộn hơn 60 giây. Tỷ lệ đạt SLA là bao nhiêu và có đạt mục tiêu không?", "a": "94% và không đạt mục tiêu.", "ex": "1.880 sự kiện đúng hạn; 1.880/2.000 = 94%, thấp hơn 95%.", "trap": "Dễ lấy 120/2.000 = 6% rồi kết luận nhầm là 'đạt 94% lỗi'."}, {"id": "H114", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Ngân hàng", "priority": "S - bắt buộc", "level": 4, "q": "Ngân hàng có 1.000 tỷ đồng khoản vay lãi suất cố định 8% và 700 tỷ đồng tiền gửi tái định giá từ 4% lên 5%; giả sử các yếu tố khác không đổi. Thu nhập lãi thuần năm giảm xấp xỉ bao nhiêu?", "a": "7 tỷ đồng.", "ex": "Chi phí lãi tăng thêm = 700 tỷ × 1% = 7 tỷ; thu nhập từ khoản vay cố định không đổi.", "trap": "Không áp cú sốc 1% lên cả tài sản nếu khoản vay cố định."}, {"id": "H115", "part": "C - Tính toán 30 giây", "type": "Tính toán", "topic": "Funnel", "priority": "S - bắt buộc", "level": 4, "q": "Một pilot có 45 SME-tháng quan sát. Mỗi SME trung bình 3 hóa đơn/tháng; 60% đủ điều kiện, 30% được gửi yêu cầu và 50% được duyệt. Số khoản giải ngân kỳ vọng là bao nhiêu?", "a": "Khoảng 12,15 khoản, tức xấp xỉ 12 khoản.", "ex": "45 × 3 × 60% × 30% × 50% = 12,15.", "trap": "SME-tháng không phải số SME duy nhất."}, {"id": "H116", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Một ngân hàng ký hợp đồng Open API với một công ty công nghệ nhưng hợp đồng chỉ mô tả kết nối kỹ thuật, không nêu phạm vi sử dụng dữ liệu và cam kết bảo mật. Theo Thông tư 64/2024/TT-NHNN, điểm thiếu cốt lõi là gì?", "a": "Hợp đồng chưa bao quát các nghĩa vụ tối thiểu về bảo mật và sử dụng dữ liệu đúng phạm vi, mục đích.", "ex": "Thông tư yêu cầu hợp đồng ngân hàng - bên thứ ba có các nội dung tối thiểu, trong đó có cam kết bảo mật và sử dụng dữ liệu đúng phạm vi, mục đích.", "trap": "Không coi hợp đồng API chỉ là tài liệu kỹ thuật."}, {"id": "H117", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Ngân hàng triển khai hệ thống Open API nhưng hệ thống an toàn thông tin mới được xác định ở cấp độ 2. Theo Thông tư 64/2024/TT-NHNN, vấn đề là gì?", "a": "Chưa đáp ứng yêu cầu tối thiểu cấp độ 3 đối với hệ thống thông tin triển khai Open API.", "ex": "Thông tư yêu cầu ngân hàng bảo đảm an toàn, an ninh mạng và hệ thống Open API đáp ứng tối thiểu cấp độ 3.", "trap": "Không nhầm yêu cầu này với hệ thống của bên thứ ba trong hợp đồng."}, {"id": "H118", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Khách hàng đồng ý cho bên thứ ba truy vấn thông tin tài khoản. Ngân hàng mặc định cho phép truy vấn liên tục trong hai năm mà không có thỏa thuận riêng với khách hàng. Theo Thông tư 64/2024/TT-NHNN, điểm nào cần xem lại?", "a": "Thời hạn truy vấn mặc định vượt mốc 180 ngày khi không có thỏa thuận khác.", "ex": "Thông tư quy định thời hạn thực hiện truy vấn sau khi khách hàng đồng ý không quá 180 ngày, trừ trường hợp khách hàng và ngân hàng có thỏa thuận khác.", "trap": "180 ngày không phải thời hạn tuyệt đối trong mọi trường hợp."}, {"id": "H119", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Ngân hàng cho khách hàng xem dữ liệu đã đồng ý chia sẻ nhưng yêu cầu khách phải ra quầy nếu muốn rút lại sự đồng ý. Theo Thông tư 64/2024/TT-NHNN, điểm thiết kế nào chưa phù hợp?", "a": "Ngân hàng phải cung cấp công cụ hoặc chức năng cho phép khách hàng rút lại sự đồng ý.", "ex": "Quyền kiểm soát của khách hàng phải được hỗ trợ bằng chức năng thực tế.", "trap": "Không chỉ cần minh bạch danh sách consent."}, {"id": "H120", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Một bên thứ ba gọi API thông tin khách hàng với tần suất rất cao nhưng vẫn dùng thông tin xác thực hợp lệ. Ngân hàng cho rằng không thể can thiệp vì 'đã consent'. Theo Thông tư 64/2024/TT-NHNN, lập luận này sai ở đâu?", "a": "Ngân hàng vẫn phải có giải pháp công nghệ giới hạn số lần truy vấn tự động.", "ex": "Consent không xóa nghĩa vụ kiểm soát tần suất và an toàn hệ thống.", "trap": "Được phép truy cập không đồng nghĩa được truy vấn vô hạn."}, {"id": "H121", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Một TPP (Third Party Provider – bên thứ ba cung cấp dịch vụ) có hành vi truy cập bất thường lúc nửa đêm nhưng thông tin xác thực vẫn hợp lệ. Ngân hàng chỉ lưu log mà không có cơ chế phát hiện chủ động. Theo Thông tư 64/2024/TT-NHNN, còn thiếu gì?", "a": "Hệ thống giám sát để phát hiện và ngăn chặn truy cập bất thường hoặc trái phép.", "ex": "Quy định yêu cầu không chỉ ghi log mà còn giám sát hoạt động truy cập.", "trap": "Ghi nhật ký thụ động không thay thế giám sát chủ động."}, {"id": "H122", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Ngân hàng chỉ giữ nhật ký sử dụng Open API trong một tháng rồi xóa toàn bộ. Theo Thông tư 64/2024/TT-NHNN, yêu cầu tối thiểu đáng nhớ là gì?", "a": "Nhật ký sử dụng Open API từ bên thứ ba phải được ghi ít nhất 3 tháng và sao lưu tối thiểu 1 năm.", "ex": "Đây là yêu cầu phục vụ kiểm tra khi cần thiết.", "trap": "Đừng nhầm thời gian lưu online với thời gian sao lưu."}, {"id": "H123", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Hợp đồng với bên thứ ba đã chấm dứt nhưng quyền truy cập dữ liệu của bên này trên hệ thống ngân hàng vẫn còn. Theo Thông tư 64/2024/TT-NHNN, trách nhiệm nào chưa được thực hiện?", "a": "Cập nhật hoặc thu hồi quyền truy cập dữ liệu của bên thứ ba khi quan hệ hợp đồng thay đổi.", "ex": "Quyền kỹ thuật phải phản ánh trạng thái pháp lý/kinh doanh của quan hệ đối tác.", "trap": "Không thể chỉ chấm dứt giấy tờ mà bỏ thông tin xác thực hoạt động."}, {"id": "H124", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Một bên thứ ba gặp sự cố an toàn thông tin nhưng chờ đến báo cáo định kỳ cuối tháng mới thông báo cho ngân hàng. Theo Thông tư 64/2024/TT-NHNN, điểm nào không ổn?", "a": "Bên thứ ba phải thông báo kịp thời cho ngân hàng khi xảy ra sự cố công nghệ thông tin hoặc an toàn thông tin.", "ex": "Hình thức và thời gian cụ thể có thể theo thỏa thuận, nhưng nguyên tắc là thông báo kịp thời.", "trap": "Không coi báo cáo định kỳ là đủ cho incident notification."}, {"id": "H125", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Một công ty Fintech muốn tham gia cơ chế thử nghiệm có kiểm soát với sản phẩm ví đầu tư tự động. Nghị định 94/2025/NĐ-CP chỉ nêu ba nhóm giải pháp Fintech được thử nghiệm. Ba nhóm đó là gì?", "a": "Chấm điểm tín dụng; chia sẻ dữ liệu qua Open API; và cho vay ngang hàng.", "ex": "Đây là ba nhóm được nêu trong Nghị định 94/2025/NĐ-CP.", "trap": "Không lấy danh mục rộng hơn từ các dự thảo cũ."}, {"id": "H126", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Một tổ chức được chấp thuận vào cơ chế thử nghiệm Fintech và cho rằng từ đó có thể thử nghiệm xuyên biên giới trong toàn ASEAN. Theo Nghị định 94/2025/NĐ-CP, nhận định này đúng không?", "a": "Không; việc thử nghiệm được giới hạn trên lãnh thổ Việt Nam.", "ex": "Cơ chế thử nghiệm có phạm vi được xác định trong giấy chứng nhận và không mặc định cho phép thử nghiệm xuyên biên giới.", "trap": "môi trường thử nghiệm không phải giấy thông hành khu vực."}, {"id": "H127", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Một giải pháp Fintech được chấp thuận thử nghiệm và doanh nghiệp lập kế hoạch thử nghiệm kéo dài liên tục bốn năm ngay từ đầu. Theo Nghị định 94/2025/NĐ-CP, mốc thời gian cơ bản cần nhớ là gì?", "a": "Thời gian thử nghiệm tối đa 2 năm cho từng giải pháp, có thể được gia hạn theo quy định.", "ex": "Nghị định đặt giới hạn cơ bản hai năm tính từ khi được cấp giấy chứng nhận tham gia.", "trap": "Không nhầm thời hạn thử nghiệm với thời hạn hoạt động của doanh nghiệp."}, {"id": "H128", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 3, "q": "Luật Bảo vệ dữ liệu cá nhân hiện hành bắt đầu có hiệu lực từ thời điểm nào?", "a": "Từ ngày 01/01/2026.", "ex": "Đây là mốc pháp lý hiện hành cần cập nhật khi học cho kỳ thi năm 2026.", "trap": "Không dùng Nghị định 13/2023 như thể vẫn là khung cao nhất hiện hành."}, {"id": "H129", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Bảo mật API", "priority": "S - bắt buộc", "level": 4, "q": "Một bên thứ ba chỉ cần quyền đọc thông tin tài khoản nhưng ngân hàng cấp thêm quyền khởi tạo thanh toán để 'dự phòng'. Nguyên tắc bảo mật nào bị vi phạm rõ nhất?", "a": "Nguyên tắc cấp quyền tối thiểu.", "ex": "Chỉ nên cấp đúng quyền cần cho mục đích hiện tại để giảm bề mặt rủi ro.", "trap": "Không cấp quyền rộng hơn chỉ vì có thể dùng sau này."}, {"id": "H130", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Bảo mật API", "priority": "S - bắt buộc", "level": 4, "q": "Một API cho phép bất kỳ người dùng đã đăng nhập nào truy cập điểm cuối API quản trị nếu họ biết đường dẫn. Theo OWASP, đây gần nhất với nhóm lỗi nào?", "a": "Lỗi phân quyền ở cấp chức năng.", "ex": "Điểm cuối API quản trị cần kiểm tra vai trò và quyền chức năng, không chỉ trạng thái đăng nhập.", "trap": "Đừng nhầm với BOLA, nơi lỗi nằm ở quyền với từng đối tượng."}, {"id": "H131", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Bảo mật API", "priority": "S - bắt buộc", "level": 4, "q": "Một API cho phép đổi số hợp đồng trong URL và xem được hợp đồng của khách hàng khác. Theo OWASP, đây gần nhất với lỗi gì?", "a": "Lỗi phân quyền ở cấp đối tượng.", "ex": "Máy chủ không kiểm tra người dùng hiện tại có quyền với đối tượng dữ liệu được yêu cầu hay không.", "trap": "Đăng nhập hợp lệ không làm yêu cầu hợp lệ."}, {"id": "H132", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Bảo mật API", "priority": "S - bắt buộc", "level": 4, "q": "Một API gửi OTP (One-Time Password – mật khẩu dùng một lần) SMS mỗi lần được gọi và không giới hạn tần suất. Kẻ tấn công tự động gọi hàng triệu lần làm chi phí SMS tăng mạnh. Theo OWASP, rủi ro cốt lõi là gì?", "a": "Tiêu thụ tài nguyên không bị giới hạn.", "ex": "API có thể bị lạm dụng để tiêu tốn tài nguyên kỹ thuật hoặc dịch vụ trả phí.", "trap": "Không chỉ có denial-of-service; còn có financial denial-of-wallet."}, {"id": "H133", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Bảo mật API", "priority": "S - bắt buộc", "level": 4, "q": "Một API nhận URL do người dùng nhập rồi máy chủ tự truy cập URL đó để lấy dữ liệu. Kẻ tấn công nhập địa chỉ dịch vụ nội bộ và đọc được siêu dữ liệu máy chủ. Nhóm rủi ro nào cần nghĩ tới?", "a": "Yêu cầu giả mạo từ phía máy chủ.", "ex": "Máy chủ bị lợi dụng để truy cập tài nguyên nội bộ mà người dùng bên ngoài không thể truy cập trực tiếp.", "trap": "Đừng chỉ lọc chuỗi URL đơn giản."}, {"id": "H134", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "OAuth 2.0", "priority": "S - bắt buộc", "level": 4, "q": "Một ứng dụng bên thứ ba yêu cầu người dùng nhập trực tiếp mật khẩu ngân hàng vào chính ứng dụng đó để lấy dữ liệu tài khoản. Vì sao cách này trái với tinh thần OAuth 2.0?", "a": "Vì OAuth 2.0 được thiết kế để cấp quyền truy cập có giới hạn mà không cần chia sẻ mật khẩu của người dùng cho ứng dụng bên thứ ba.", "ex": "Ứng dụng nên nhận token/ủy quyền thay vì thông tin xác thực gốc.", "trap": "OAuth không có nghĩa ứng dụng được biết password."}, {"id": "H135", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "OAuth 2.0", "priority": "S - bắt buộc", "level": 4, "q": "Mã truy cập bị đánh cắp nhưng mã này chỉ có quyền đọc số dư, không có quyền khởi tạo thanh toán. Biện pháp thiết kế nào đã giúp giới hạn thiệt hại?", "a": "Giới hạn phạm vi quyền của token.", "ex": "Nếu mã truy cập bị lộ, phạm vi quyền hẹp sẽ làm giảm mức độ thiệt hại có thể xảy ra.", "trap": "Token còn hiệu lực vẫn nguy hiểm, nhưng thiệt hại không nhất thiết ngang nhau."}, {"id": "H136", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Bảo mật", "priority": "S - bắt buộc", "level": 4, "q": "Ngân hàng sử dụng mTLS (Mutual Transport Layer Security – TLS hai chiều) để xác thực cả máy chủ ngân hàng và máy chủ đối tác ở tầng kết nối. mTLS giải quyết vấn đề nào tốt hơn chỉ dùng TLS một chiều?", "a": "Xác thực lẫn nhau giữa hai phía kết nối.", "ex": "TLS một chiều thường chủ yếu xác thực máy chủ với phía kết nối; mTLS yêu cầu cả hai phía cùng trình chứng thư để xác thực lẫn nhau.", "trap": "mTLS không thay thế authorization nghiệp vụ."}, {"id": "H137", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Dữ liệu", "priority": "S - bắt buộc", "level": 4, "q": "Một mô hình AI dùng lịch sử giao dịch của khách hàng để quyết định ưu đãi. Nhóm phát triển giữ toàn bộ dữ liệu thô vô thời hạn 'phòng khi cần'. Nguyên tắc quản trị nào cần chất vấn?", "a": "Giới hạn thời gian lưu giữ và chỉ giữ dữ liệu cần thiết cho mục đích xác định.", "ex": "Giữ vô thời hạn làm tăng rủi ro và khó chứng minh necessity.", "trap": "Có kho dữ liệu tập trung không đồng nghĩa được giữ mọi dữ liệu mãi mãi."}, {"id": "H138", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Dữ liệu", "priority": "S - bắt buộc", "level": 4, "q": "Một doanh nghiệp có dữ liệu khách hàng chính xác nhưng không thể biết trường nào đến từ hệ thống nào và đã qua những biến đổi gì. Thiếu năng lực quản trị nào?", "a": "Khả năng truy vết nguồn gốc và dòng biến đổi dữ liệu.", "ex": "Data lineage giúp điều tra sai lệch, kiểm toán và giải thích kết quả mô hình.", "trap": "Chất lượng dữ liệu không chỉ là accuracy."}, {"id": "H139", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Dữ liệu", "priority": "S - bắt buộc", "level": 4, "q": "Một mô hình tín dụng được huấn luyện trên dữ liệu thành thị nhưng triển khai rộng ở nông thôn mà không kiểm định lại. Rủi ro dữ liệu/mô hình nổi bật là gì?", "a": "Mẫu huấn luyện không đại diện cho nhóm triển khai, dẫn đến sai lệch hiệu năng và có thể gây thiên lệch.", "ex": "Generalization phụ thuộc sự tương đồng giữa nhóm dữ liệu huấn luyện và nhóm áp dụng.", "trap": "Không thể suy rộng vô điều kiện."}, {"id": "H140", "part": "D - Pháp lý, bảo mật, dữ liệu", "type": "Ứng dụng pháp lý/bảo mật", "topic": "Pháp lý Việt Nam", "priority": "S - bắt buộc", "level": 4, "q": "Một ngân hàng đã có kết nối API với bên thứ ba từ trước khi Thông tư 64/2024/TT-NHNN có hiệu lực và cho rằng không cần điều chỉnh vì 'hệ thống cũ được miễn'. Theo điều khoản chuyển tiếp, nhận định đó đúng không?", "a": "Không; các kết nối cũ vẫn phải được đưa về tuân thủ, hoàn thành trước ngày 01/03/2027.", "ex": "Thông tư có điều khoản chuyển tiếp chứ không miễn vĩnh viễn hệ thống cũ.", "trap": "Đừng nhầm miễn trừ vĩnh viễn cho hệ thống cũ với giai đoạn chuyển tiếp."}, {"id": "H141", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Open Banking", "priority": "A - rất nên biết", "level": 4, "q": "Một thị trường có hàng chục ngân hàng mở API tự nguyện nhưng không có chuẩn chung. Số lượng API tăng nhanh, song chi phí tích hợp của Fintech cũng tăng nhanh. Vì sao 'nhiều API hơn' chưa chắc đồng nghĩa thị trường mở hơn?", "a": "Vì mức độ mở còn phụ thuộc khả năng tương tác và chi phí kết nối, không chỉ số lượng API.", "ex": "Nếu mỗi ngân hàng dùng chuẩn riêng, chi phí tích hợp và duy trì có thể tạo rào cản gia nhập.", "trap": "Đừng dùng supply count thay cho khả năng tương tác."}, {"id": "H142", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Open Banking", "priority": "A - rất nên biết", "level": 4, "q": "Một cơ quan quản lý muốn thúc đẩy cạnh tranh nên bắt buộc chuẩn API rất chi tiết cho mọi ngân hàng, kể cả ngân hàng nhỏ. Nếu chi phí tuân thủ cố định quá cao, chính sách có thể tạo tác dụng phụ nào?", "a": "Làm tăng rào cản tuân thủ và bất lợi tương đối cho tổ chức nhỏ.", "ex": "Chuẩn hóa tạo lợi ích nhưng chi phí tuân thủ cố định có thể phân bổ khó hơn ở quy mô nhỏ.", "trap": "Quy định thúc đẩy cạnh tranh vẫn có thể vô tình làm concentration tăng."}, {"id": "H143", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Open Finance", "priority": "A - rất nên biết", "level": 4, "q": "Một hệ thống Open Finance yêu cầu ngân hàng chia sẻ dữ liệu nhưng các công ty bảo hiểm và đầu tư không phải chia sẻ ngược dữ liệu tương đương. Rủi ro cạnh tranh dài hạn là gì?", "a": "Bất cân xứng dữ liệu và nghĩa vụ có thể tạo sân chơi không cân bằng giữa các ngành.", "ex": "Reciprocity ảnh hưởng động lực tham gia và khả năng cạnh tranh.", "trap": "Mở dữ liệu một chiều có thể tạo lợi thế cho bên nhận."}, {"id": "H144", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Open Finance", "priority": "A - rất nên biết", "level": 4, "q": "Một nhà cung cấp trung gian đứng giữa người dùng và nhiều tổ chức tài chính, lưu trữ toàn bộ consent và định tuyến dữ liệu. Mô hình này đơn giản hóa tích hợp nhưng tạo thêm rủi ro gì?", "a": "Tập trung dữ liệu, quyền truy cập và phụ thuộc vận hành tại một trung gian quan trọng.", "ex": "Intermediary có thể giảm complexity nhưng đồng thời tăng concentration risk.", "trap": "Đừng chỉ nhìn giảm số kết nối song phương."}, {"id": "H145", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một ngân hàng muốn giữ khách hàng trong ứng dụng của mình nên hạn chế chia sẻ dữ liệu tối đa. Trong ngắn hạn cách này có thể giảm tỷ lệ rời bỏ, nhưng trong hệ sinh thái Open Banking có thể gây tác dụng ngược nào?", "a": "Làm trải nghiệm kém cạnh tranh và khiến khách hàng chuyển sang nhà cung cấp cung cấp khả năng kết nối tốt hơn.", "ex": "Lock-in cưỡng ép có thể làm giảm loyalty thực.", "trap": "Giữ chân khách hàng không chỉ đến từ việc làm tăng chi phí chuyển đổi."}, {"id": "H146", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một Fintech miễn phí dịch vụ quản lý tài chính cá nhân để thu hút người dùng, sau đó kiếm tiền từ referral khoản vay. Khi đánh giá mô hình, chỉ nhìn doanh thu referral là chưa đủ vì còn phải theo dõi gì?", "a": "Chi phí thu hút người dùng, tỷ lệ duy trì, tỷ lệ chuyển đổi và chất lượng khách hàng được giới thiệu.", "ex": "Mô hình nhiều bước có hiệu quả kinh tế phụ thuộc toàn funnel.", "trap": "Revenue cuối funnel không phản ánh cost để tạo traffic."}, {"id": "H147", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một ngân hàng đưa dịch vụ tín dụng vào nền tảng kế toán của SME. Tỷ lệ chuyển đổi tăng vì khách hàng không phải rời hệ thống. Giá trị chiến lược lớn nhất của mô hình này nằm ở đâu?", "a": "Đưa dịch vụ tài chính đến đúng thời điểm và ngữ cảnh phát sinh nhu cầu.", "ex": "Embedded Finance giảm ma sát bằng cách gắn dịch vụ vào workluồng.", "trap": "Không phải chỉ vì thêm một kênh bán hàng."}, {"id": "H148", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một ngân hàng có thể tự xây mọi trải nghiệm hoặc cung cấp năng lực ngân hàng như một dịch vụ cho nhiều đối tác. Khi chọn hướng thứ hai, lợi ích và rủi ro chiến lược đi kèm là gì?", "a": "Mở rộng phân phối nhanh hơn nhưng có thể giảm quyền kiểm soát trải nghiệm và thương hiệu khách hàng cuối.", "ex": "BaaS tạo leverage qua đối tác nhưng làm ngân hàng xa giao diện trực tiếp với khách hàng hơn.", "trap": "Không có kênh nào chỉ có upside."}, {"id": "H149", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Premium API", "priority": "A - rất nên biết", "level": 4, "q": "Ngân hàng cung cấp API kiểm tra thu nhập theo thời gian thực cho bên cho vay. API giúp giảm fraud và rút ngắn phê duyệt đáng kể. Nếu ngân hàng chỉ định giá theo số byte dữ liệu truyền, điều gì bị bỏ sót?", "a": "Giá trị nghiệp vụ mà API tạo ra cho đối tác.", "ex": "Premium API nên được xem như một sản phẩm tạo giá trị nghiệp vụ, không chỉ là hạ tầng tính phí theo mức sử dụng.", "trap": "Data sản lượng không phải thước đo duy nhất của mức sẵn sàng chi trả."}, {"id": "H150", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Premium API", "priority": "A - rất nên biết", "level": 4, "q": "Một ngân hàng áp phí cố định rất cao để thu hồi chi phí nền tảng. Đối tác nhỏ không tham gia, sản lượng thấp khiến chi phí bình quân càng cao. Đây có thể là vòng lặp tiêu cực gì?", "a": "Giá cao làm giảm mức độ sử dụng, mức độ sử dụng thấp làm giảm khả năng phân bổ chi phí cố định và củng cố giá cao.", "ex": "nền tảng hiệu quả kinh tế có thể có feedback loop.", "trap": "Không tối ưu phí cố định độc lập với quy mô mạng lưới."}, {"id": "H151", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Cạnh tranh", "priority": "A - rất nên biết", "level": 4, "q": "Open Banking làm chi phí chuyển đổi tài khoản và so sánh sản phẩm giảm. Nếu sản phẩm ngân hàng vốn khác biệt rất ít, áp lực cạnh tranh có khả năng xuất hiện mạnh nhất ở đâu?", "a": "Giá, phí, trải nghiệm và tốc độ đổi mới dịch vụ.", "ex": "Khi switching/search cost giảm, khách hàng dễ so sánh và chuyển nhà cung cấp hơn.", "trap": "Không phải cạnh tranh chỉ ở lãi suất."}, {"id": "H152", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Cạnh tranh", "priority": "A - rất nên biết", "level": 4, "q": "Một ngân hàng mất độc quyền dữ liệu giao dịch của khách hàng nhưng vẫn giữ lợi thế lớn về vốn, giấy phép và quản trị rủi ro. Open Banking có xóa hoàn toàn lợi thế của ngân hàng truyền thống không?", "a": "Không.", "ex": "Open Banking làm giảm một số lợi thế thông tin nhưng không xóa lợi thế về bảng cân đối kế toán, trust, bắt buộc tuân thủ, risk management và infrastructure.", "trap": "Tránh suy luận 'data open = bank obsolete'."}, {"id": "H153", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Phổ cập tài chính", "priority": "A - rất nên biết", "level": 4, "q": "Một mô hình alternative data giúp chấm điểm người chưa có lịch sử tín dụng nhưng yêu cầu smartphone đời mới và lịch sử giao dịch số dày. Vì sao mô hình vẫn có thể bỏ sót nhóm cần phổ cập tài chính nhất?", "a": "Vì điều kiện dữ liệu số có thể tạo một dạng loại trừ mới đối với người ít dấu vết số.", "ex": "Alternative data không tự động giải quyết inclusion.", "trap": "Không đồng nhất digital footprint với toàn bộ dân số mục tiêu."}, {"id": "H154", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Phổ cập tài chính", "priority": "A - rất nên biết", "level": 4, "q": "Một chính sách Open Banking đặt mục tiêu phổ cập tài chính. Sau triển khai, số tài khoản kết nối tăng mạnh nhưng số người trước đây không có khả năng tiếp cận tín dụng gần như không đổi. KPI nào cho thấy mục tiêu chính sách chưa đạt?", "a": "Tỷ lệ tiếp cận dịch vụ tài chính thực chất của nhóm mục tiêu không cải thiện.", "ex": "Connectivity là input/intermediate output, không phải kết quả thực cuối.", "trap": "Đừng dùng API connection count thay cho inclusion."}, {"id": "H155", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Nền tảng", "priority": "A - rất nên biết", "level": 4, "q": "Một nền tảng kết nối càng nhiều ngân hàng thì càng hấp dẫn người dùng; càng nhiều người dùng thì càng hấp dẫn ngân hàng. Cơ chế kinh tế này là gì và vì sao quan trọng?", "a": "Hiệu ứng mạng lưới hai phía.", "ex": "Giá trị của một phía tăng khi phía còn lại tăng, tạo lợi thế cho nền tảng đạt quy mô sớm.", "trap": "Không phải mọi API marketplace đều có hiệu ứng mạng lưới mạnh như nhau."}, {"id": "H156", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Nền tảng", "priority": "A - rất nên biết", "level": 4, "q": "Một Fintech phụ thuộc 80% doanh thu vào một ngân hàng đối tác dù có tích hợp mười ngân hàng. Chỉ số 'số lượng ngân hàng tích hợp' đang che giấu rủi ro gì?", "a": "Rủi ro tập trung doanh thu và sức mạnh thương lượng của đối tác lớn.", "ex": "Breadth of integrations không đồng nghĩa diversified hiệu quả kinh tế.", "trap": "Đừng dùng logo count thay cho concentration metrics."}, {"id": "H157", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "DPI", "priority": "A - rất nên biết", "level": 4, "q": "Một quốc gia xây hạ tầng định danh số, thanh toán thời gian thực và chia sẻ dữ liệu theo chuẩn chung để nhiều doanh nghiệp có thể xây dịch vụ phía trên. Lợi ích chiến lược của cách tiếp cận hạ tầng số công cộng là gì?", "a": "Tạo lớp hạ tầng dùng chung giúp giảm chi phí xây lại chức năng nền tảng và thúc đẩy đổi mới ở lớp ứng dụng.", "ex": "DPI có thể tạo reusable rails cho danh tính, payments và data exchange.", "trap": "Hạ tầng dùng chung vẫn cần governance, bảo mật và competition safeguards."}, {"id": "H158", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Rủi ro hệ thống", "priority": "A - rất nên biết", "level": 4, "q": "Một thị trường tài chính số có mức kết nối API rất cao. Khi một provider lớn gửi dữ liệu sai, nhiều mô hình tín dụng và tư vấn cùng phản ứng sai trong vài phút. Điều này cho thấy rủi ro mới nào của kết nối sâu?", "a": "Rủi ro lan truyền nhanh từ lỗi dữ liệu hoặc lỗi công nghệ qua các tổ chức phụ thuộc lẫn nhau.", "ex": "Interconnectedness tăng efficiency nhưng cũng tăng speed of contagion.", "trap": "Không chỉ cyberattack mới tạo systemic propagation."}, {"id": "H159", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Quản trị hệ sinh thái", "priority": "A - rất nên biết", "level": 4, "q": "Nếu ngân hàng chịu trách nhiệm thẩm định đối tác nhưng đối tác lại tích hợp thêm nhiều nhà thầu phụ xử lý dữ liệu, ngân hàng nên nhìn rủi ro theo quan hệ trực tiếp hay theo toàn chuỗi?", "a": "Theo toàn chuỗi xử lý và phụ thuộc dữ liệu, không chỉ đối tác trực tiếp.", "ex": "Third-party risk có thể mở rộng thành fourth-party risk.", "trap": "Hợp đồng với TPP không xóa rủi ro từ subcontractor."}, {"id": "H160", "part": "E - Chiến lược và Open Finance", "type": "Chiến lược 30 giây", "topic": "Chiến lược", "priority": "A - rất nên biết", "level": 4, "q": "Một ngân hàng quyết định mở càng nhiều API càng tốt để chứng minh đổi mới. Sau một năm, nhiều API hầu như không có người dùng nhưng vẫn tốn chi phí duy trì và bảo mật. Bài học quản trị danh mục là gì?", "a": "Số lượng API không phải mục tiêu; cần ưu tiên API có nhu cầu, giá trị và hiệu quả kinh tế rõ ràng.", "ex": "Product danh mục phải có lifecycle management và tiêu chí sunset.", "trap": "Innovation theater có thể tạo nợ kỹ thuật."}];
let set=[],pos=-1,t=30,timer=null,correct=0,wrong=0,skipped=0,miss=[];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function pick(a,n){return shuffle(a).slice(0,Math.min(n,a.length))}
const rapid=()=>bank.filter(x=>x.part.startsWith('A'));
const scenario=()=>bank.filter(x=>x.part.startsWith('B'));
const calc=()=>bank.filter(x=>x.part.startsWith('C'));
const legal=()=>bank.filter(x=>x.part.startsWith('D'));
const strategy=()=>bank.filter(x=>x.part.startsWith('E'));
function startOfficial(){set=[...pick(rapid(),12),...shuffle([...pick(scenario(),2),...pick(calc(),2),...pick(legal(),2),...pick(strategy(),2)])];reset()}
function startRapid(){set=pick(rapid(),12);reset()}
function startStage2(){set=shuffle([...pick(scenario(),2),...pick(calc(),2),...pick(legal(),2),...pick(strategy(),2)]);reset()}
function startS(){set=pick(bank.filter(x=>x.priority.startsWith('S')),20);reset()}
function reset(){pos=-1;correct=wrong=skipped=0;miss=[];next()}
function tick(){t--;document.getElementById('timer').textContent=t;document.getElementById('prog').value=t;if(t<=0){clearInterval(timer);reveal()}}
function next(){if(timer)clearInterval(timer);pos++;if(pos>=set.length){finish();return}const x=set[pos];t=30;
document.getElementById('timer').textContent=t;document.getElementById('prog').value=t;
document.getElementById('q').textContent=x.q;document.getElementById('answer').style.display='none';
document.getElementById('answer').innerHTML='<b>Đáp án 30 giây:</b> '+x.a+'<br><br><b>Vì sao:</b> '+x.ex+'<br><b>Bẫy:</b> '+x.trap;
document.getElementById('topic').textContent=x.topic;document.getElementById('idx').textContent=(pos+1)+'/'+set.length;
document.getElementById('phase').textContent=x.part.startsWith('A')?'CHẶNG 1':'CHẶNG 2';
document.getElementById('score').textContent=correct+' đúng | '+wrong+' sai | '+skipped+' bỏ';
timer=setInterval(tick,1000)}
function reveal(){document.getElementById('answer').style.display='block'}
function mark(ok){if(pos<0||pos>=set.length)return;if(ok)correct++;else{wrong++;miss.push(set[pos])}next()}
function skip(){if(pos<0||pos>=set.length)return;skipped++;miss.push(set[pos]);next()}
function finish(){if(timer)clearInterval(timer);document.getElementById('timer').textContent='✓';document.getElementById('prog').value=30;
document.getElementById('q').textContent='HOÀN THÀNH';document.getElementById('phase').textContent='KẾT QUẢ';
document.getElementById('answer').style.display='block';
let list=miss.map(x=>'• '+x.q+' → '+x.a).join('<br><br>');
document.getElementById('answer').innerHTML='<div class="result"><b>Điểm: '+correct+'/'+set.length+'</b><br>Sai: '+wrong+' | Bỏ qua: '+skipped+'</div><br>'+list;
document.getElementById('score').textContent=correct+' đúng | '+wrong+' sai | '+skipped+' bỏ';
}
</script></body></html>
